name: Push Supabase config

on:
  push:
    branches:
      - main
    paths:
      - "supabase/config.toml"
      - "supabase/templates/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require production remotes secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID RESEND_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the missing repository secrets before deploying."
            exit 1
          fi

      - name: Push project config
        run: supabase --yes config push --project-ref "$SUPABASE_PROJECT_ID"
